# Pings the Render free web service every ~10 minutes so it does not sleep
# (sleeping causes the slow first request / 502 through the Vercel proxy).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${RENDER_URL:-https://pocketsmartai-7n55.onrender.com}/health"
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
